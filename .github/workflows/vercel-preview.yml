name: Vercel Preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to deploy'
        required: false
        default: 'main'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - name: Validate required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TEST_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.STRIPE_PRICE_PRO_MONTHLY }}
          STRIPE_PRICE_PRO_YEARLY: ${{ secrets.STRIPE_PRICE_PRO_YEARLY }}
          STRIPE_PRICE_COACH_MONTHLY: ${{ secrets.STRIPE_PRICE_COACH_MONTHLY }}
          STRIPE_PRICE_COACH_YEARLY: ${{ secrets.STRIPE_PRICE_COACH_YEARLY }}
          STRIPE_PRICE_ELITE_MONTHLY: ${{ secrets.STRIPE_PRICE_ELITE_MONTHLY }}
          STRIPE_PRICE_ELITE_YEARLY: ${{ secrets.STRIPE_PRICE_ELITE_YEARLY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HEALTH_OAUTH_TOKEN_ENCRYPTION_KEY: ${{ secrets.HEALTH_OAUTH_TOKEN_ENCRYPTION_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          missing=0
          required_names=(
            VERCEL_TOKEN
            VERCEL_ORG_ID
            VERCEL_PROJECT_ID
            SUPABASE_URL
            SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_TEST_ACCESS_TOKEN
            VITE_SENTRY_DSN
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
            STRIPE_PRICE_PRO_MONTHLY
            STRIPE_PRICE_PRO_YEARLY
            STRIPE_PRICE_COACH_MONTHLY
            STRIPE_PRICE_COACH_YEARLY
            STRIPE_PRICE_ELITE_MONTHLY
            STRIPE_PRICE_ELITE_YEARLY
            GEMINI_API_KEY
            HEALTH_OAUTH_TOKEN_ENCRYPTION_KEY
            SENTRY_AUTH_TOKEN
            SENTRY_ORG
            SENTRY_PROJECT
          )
          for name in "${required_names[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for beta preview preflight/smoke."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Local gates
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          VITE_FEATURE_AUDIENCE: user
          VITE_ENV: staging
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Pull Vercel preview environment
        run: npx vercel@latest pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel preview
        env:
          VITE_FEATURE_AUDIENCE: user
          VITE_ENV: staging
        run: npx vercel@latest build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Vercel preview
        id: deploy
        run: |
          preview_url="$(npx vercel@latest deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $preview_url"

      - name: Preflight preview env
        env:
          VITE_ENV: staging
          VITE_FEATURE_AUDIENCE: user
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          VITE_GEMINI_PROXY_URL: ${{ vars.VITE_GEMINI_PROXY_URL || '/api/gemini-proxy' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_APP_URL: ${{ steps.deploy.outputs.preview_url }}
          SUPABASE_TEST_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.STRIPE_PRICE_PRO_MONTHLY }}
          STRIPE_PRICE_PRO_YEARLY: ${{ secrets.STRIPE_PRICE_PRO_YEARLY }}
          STRIPE_PRICE_COACH_MONTHLY: ${{ secrets.STRIPE_PRICE_COACH_MONTHLY }}
          STRIPE_PRICE_COACH_YEARLY: ${{ secrets.STRIPE_PRICE_COACH_YEARLY }}
          STRIPE_PRICE_ELITE_MONTHLY: ${{ secrets.STRIPE_PRICE_ELITE_MONTHLY }}
          STRIPE_PRICE_ELITE_YEARLY: ${{ secrets.STRIPE_PRICE_ELITE_YEARLY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_DEPLOY_ENV: staging
          APP_URL: ${{ steps.deploy.outputs.preview_url }}
          CORS_ALLOWED_ORIGINS: ${{ steps.deploy.outputs.preview_url }}
          OAUTH_REDIRECT_ALLOWED_ORIGINS: ${{ steps.deploy.outputs.preview_url }}
          OAUTH_TOKEN_SECURITY_MODE: ${{ vars.OAUTH_TOKEN_SECURITY_MODE || 'encrypted' }}
          HEALTH_OAUTH_TOKEN_ENCRYPTION_KEY: ${{ secrets.HEALTH_OAUTH_TOKEN_ENCRYPTION_KEY }}
        run: npm run preflight:sprint3

      - name: Smoke deployed preview
        env:
          STAGING_APP_URL: ${{ steps.deploy.outputs.preview_url }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_TEST_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
          STRIPE_SMOKE_PLAN_ID: ${{ vars.STRIPE_SMOKE_PLAN_ID || 'pro' }}
          STRIPE_SMOKE_INTERVAL: ${{ vars.STRIPE_SMOKE_INTERVAL || 'month' }}
          GEMINI_SMOKE_EXPECT_SUCCESS: ${{ vars.GEMINI_SMOKE_EXPECT_SUCCESS || 'false' }}
          SPRINT3_SMOKE_STRICT: 'true'
        run: npm run smoke:sprint3
