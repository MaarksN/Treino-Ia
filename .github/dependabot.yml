version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      frontend-tooling:
        patterns:
          - "@vitejs/*"
          - "vite"
          - "vitest"
          - "typescript"
          - "eslint*"
      test-tooling:
        patterns:
          - "@playwright/*"
          - "@testing-library/*"
          - "@axe-core/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: America/Sao_Paulo
