openapi: 3.1.0
info:
  title: Treino IA Public API
  version: 0.1.0
  description: API contracts for billing, AI proxy, compliance, offline sync, gamification, health integrations, telemetry, and webhooks. All API responses expose X-Correlation-ID for support and incident triage.
servers:
  - url: https://{deploymentHost}
    description: Staging/production Vercel deployment. Replace the default example with the validated URL from the latest Vercel Preview or production deploy evidence.
    variables:
      deploymentHost:
        default: staging.treinoia.example
        description: Example placeholder only; do not treat as validated production evidence.
  - url: http://localhost:3000
    description: Local Vite/Vercel dev
security:
  - bearerAuth: []
paths:
  /api/billing/entitlement:
    get:
      summary: Load server-side plan, subscription status, and entitlements.
      responses:
        '200':
          description: Entitlement summary.
        '401':
          description: Missing or invalid Supabase session.
  /api/stripe/create-checkout-session:
    post:
      summary: Create a Stripe Checkout session for Pro, Coach, or Elite.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, interval]
              properties:
                planId:
                  type: string
                  enum: [pro, coach, elite]
                interval:
                  type: string
                  enum: [month, year]
      responses:
        '200':
          description: Checkout URL and Stripe session id.
  /api/stripe/create-portal-session:
    post:
      summary: Create a Stripe customer portal session.
      responses:
        '200':
          description: Portal URL.
  /api/stripe/webhook:
    post:
      summary: Signed Stripe webhook endpoint.
      security: []
      parameters:
        - in: header
          name: stripe-signature
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event accepted.
        '400':
          description: Invalid signature.
  /api/gemini-proxy:
    post:
      summary: Authenticated Gemini proxy with billing limits, rate limiting, and private cache.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Gemini API response.
        '402':
          description: Free plan monthly AI limit reached.
        '429':
          description: Per-minute rate limit reached.
  /api/sync/offline-actions:
    post:
      summary: Sync one queued offline action with idempotency.
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, payload]
              properties:
                id:
                  type: string
                type:
                  type: string
                payload:
                  type: object
                createdAt:
                  type: number
      responses:
        '200':
          description: Action stored.
  /api/telemetry/errors:
    post:
      summary: Flush client error telemetry to Supabase.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [message, source]
      responses:
        '200':
          description: Events stored.
  /api/compliance/export:
    post:
      summary: Export all portable user data for LGPD/GDPR data portability.
      responses:
        '200':
          description: Aggregated JSON export for the authenticated user.
        '401':
          description: Missing or invalid Supabase session.
  /api/compliance/erasure:
    post:
      summary: Cancel connected billing and physically erase the authenticated user.
      responses:
        '200':
          description: User data deletion was orchestrated.
        '401':
          description: Missing or invalid Supabase session.
        '500':
          description: Physical deletion failed.
  /api/gamification/state:
    get:
      summary: Load server-side gamification profile, ledger, missions, cosmetics, season, clan, and avatar state.
      responses:
        '200':
          description: Gamification state.
        '401':
          description: Missing or invalid Supabase session.
  /api/gamification/event:
    post:
      summary: Apply an idempotent gamification event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType]
              properties:
                eventType:
                  type: string
                  enum:
                    - login
                    - checkin
                    - daily_checkin
                    - workout_completed
                    - mission_claimed
                    - cosmetic_purchased
                    - loot_box_opened
                    - season_reward_claimed
                    - clan_joined
                    - clan_contribution
                sourceId:
                  type: string
                cost:
                  type: number
      responses:
        '200':
          description: Event applied or safely skipped.
        '400':
          description: Invalid event payload.
        '409':
          description: Duplicate or conflicting event.
  /api/security/rate-limit:
    get:
      summary: Lightweight per-IP rate limit probe for security smoke tests.
      security: []
      responses:
        '200':
          description: Request is allowed.
        '429':
          description: Rate limit exceeded.
  /api/jobs/create:
    post:
      summary: Queue a heavier background job such as PDF export or AI report generation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobType]
              properties:
                jobType:
                  type: string
                  enum: [pdf_export, quarterly_ai_report, nutrition_report]
                payload:
                  type: object
      responses:
        '202':
          description: Job queued.
  /api/health/oauth/start:
    post:
      summary: Start OAuth for supported health providers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [google_fit, fitbit, strava]
                redirectTo:
                  type: string
      responses:
        '200':
          description: Provider authorization URL and expiration.
  /api/health/oauth/callback:
    get:
      summary: Health provider OAuth callback.
      responses:
        '302':
          description: Redirect back to the application.
  /api/health/sync:
    post:
      summary: Trigger health data sync for connected providers.
      responses:
        '200':
          description: Sync job created.
  /api/retention/worker:
    get:
      summary: Process scheduled retention check-ins and habit reminders.
      security:
        - cronSecret: []
      responses:
        '200':
          description: Retention jobs processed.
        '401':
          description: Invalid worker secret.
    post:
      summary: Process scheduled retention check-ins and habit reminders.
      security:
        - cronSecret: []
      responses:
        '200':
          description: Retention jobs processed.
        '401':
          description: Invalid worker secret.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
    cronSecret:
      type: http
      scheme: bearer
      bearerFormat: RETENTION_WORKER_SECRET
  parameters:
    CorrelationId:
      in: header
      name: X-Correlation-ID
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
